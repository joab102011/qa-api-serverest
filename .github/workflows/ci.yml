# =============================================================================
# GitHub Actions — INATIVO por padrao
# =============================================================================
# Pipeline auto-suficiente: container Playwright oficial + npm ci + testes.
# Sem instalar browser/deps na maquina do avaliador. Artefatos always.
# Espelho: .gitlab-ci.yml | Ativar: descomentar push/PR e remover if: false.
# =============================================================================

name: CI API ServeRest

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  testar_api:
    if: false # CI inativo — remova esta linha ao ativar
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias do projeto
        run: npm ci
      - name: Executar suite Playwright (headless / API)
        run: npx playwright test
        env:
          URL_BASE: ${{ vars.URL_BASE }}
      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-api
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 7

  gerar_allure:
    if: false # CI inativo — remova esta linha ao ativar
    needs: [testar_api]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Baixar allure-results
        uses: actions/download-artifact@v4
        with:
          name: relatorios-api
      - name: Gerar Allure HTML
        run: npx allure generate allure-results --clean -o allure-report || true
      - name: Publicar Allure HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
