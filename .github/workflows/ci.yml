# =============================================================================
# GitHub Actions — INATIVO por padrao (quality gate pronto para ligar)
# =============================================================================
# COMO ATIVAR (3 passos):
#   1) Descomente os blocos push / pull_request em "on:"
#   2) Remova "if: false" dos jobs abaixo
#   3) Push na main ou abra um PR — artefatos sobem sempre (when: always)
#
# Camadas: smoke (feedback rapido) → regressao completa → Allure HTML
# Espelho GitLab: .gitlab-ci.yml
# =============================================================================

name: CI API ServeRest

on:
  workflow_dispatch:
  # --- ATIVAR: descomente ---
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  verificar_tipos:
    if: false # ATIVAR: remova esta linha
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run verificar:tipos

  smoke_api:
    if: false # ATIVAR: remova esta linha
    needs: [verificar_tipos]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Smoke (@smoke) — gate rapido
        run: npm run testar:smoke
        env:
          URL_BASE: ${{ vars.URL_BASE }}
      - name: Artefatos smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-api-smoke
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 7

  testar_api:
    if: false # ATIVAR: remova esta linha
    needs: [smoke_api]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias do projeto
        run: npm ci
      - name: Regressao completa Playwright (API)
        run: npx playwright test
        env:
          URL_BASE: ${{ vars.URL_BASE }}
      - name: Publicar artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-api
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 7

  gerar_allure:
    if: false # ATIVAR: remova esta linha
    needs: [testar_api]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Baixar allure-results
        uses: actions/download-artifact@v4
        with:
          name: relatorios-api
      - name: Gerar Allure HTML
        run: npx allure generate allure-results --clean -o allure-report || true
      - name: Publicar Allure HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7
