# =============================================================================
# GitLab CI — INATIVO por padrao
# =============================================================================
# Pipeline espelhada no GitHub Actions (.github/workflows/ci.yml).
# Nao cria pipeline automatica. Para ativar: altere workflow.rules abaixo
# (ex.: permitir default branch / MR). Detalhes: README.md (Estrategia de CI).
# =============================================================================

workflow:
  rules:
    - when: never # CI inativo — troque por rules de branch/MR ao ativar

stages:
  - testar
  - relatorio

variaveis_padrao: &node
  image: mcr.microsoft.com/playwright:v1.49.1-jammy
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

testar_api:
  <<: *node
  stage: testar
  script:
    - npm ci
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - allure-results/
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

gerar_allure:
  <<: *node
  stage: relatorio
  needs: ["testar_api"]
  script:
    - npm ci
    - npx allure generate allure-results --clean -o allure-report || true
  artifacts:
    when: always
    paths:
      - allure-report/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
