# =============================================================================
# GitLab CI — INATIVO por padrao (quality gate pronto para ligar)
# =============================================================================
# COMO ATIVAR:
#   Troque o bloco workflow.rules abaixo por:
#
#   workflow:
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#       - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#
# Camadas: verificar_tipos → smoke_api → testar_api → gerar_allure
# Espelho GitHub: .github/workflows/ci.yml
# =============================================================================

workflow:
  rules:
    - when: never # CI inativo — substitua pelas rules do comentario acima

stages:
  - verificar
  - smoke
  - testar
  - relatorio

variaveis_padrao: &node
  image: mcr.microsoft.com/playwright:v1.62.1-jammy
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

verificar_tipos:
  <<: *node
  stage: verificar
  before_script:
    - npm ci
  script:
    - npm run verificar:tipos
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

smoke_api:
  <<: *node
  stage: smoke
  needs: ["verificar_tipos"]
  before_script:
    - npm ci
  script:
    - npm run testar:smoke
  artifacts:
    when: always
    paths:
      - playwright-report/
      - allure-results/
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

testar_api:
  <<: *node
  stage: testar
  needs: ["smoke_api"]
  before_script:
    - node -v && npm -v
    - npm ci
  script:
    - npx playwright test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - allure-results/
      - test-results/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true

gerar_allure:
  <<: *node
  stage: relatorio
  needs: ["testar_api"]
  before_script:
    - npm ci
  script:
    - npx allure generate allure-results --clean -o allure-report || true
  artifacts:
    when: always
    paths:
      - allure-report/
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
